workflows:
  maximus-android:
    name: MAXIMUS ECU Android
    max_build_duration: 60
    instance_type: linux_x2

    environment:
      flutter: stable

    scripts:
      - name: Prepare Flutter project
        script: |
          flutter create --platforms=android --project-name maximus_ecu .
          flutter pub get

      - name: Build APK
        script: flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
